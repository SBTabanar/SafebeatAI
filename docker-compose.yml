services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safebeat-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - HOST=0.0.0.0
      - FLASK_DEBUG=false
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:5174,http://localhost:5173
      - RATE_LIMIT=100 per minute
      - MODEL_PATH=ensemble_models.pkl
      - META_PATH=model_meta.json
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - API_KEY=${API_KEY:-}
      - AUDIT_LOG=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - safebeat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safebeat-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - safebeat-network

networks:
  safebeat-network:
    driver: bridge
